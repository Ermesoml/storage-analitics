name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Test release policy and retry behavior
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build and run static Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          target="$(uname -m)-unknown-linux-musl"
          rustup target add "$target"
          cargo build --locked --release --target "$target"
          python3 tests/smoke_tui.py "target/$target/release/storage_analytics"
      - name: Upload tested Linux executable for PR review
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-executable-${{ matrix.os }}
          path: target/*-unknown-linux-musl/release/storage_analytics
          if-no-files-found: error
          retention-days: 7
